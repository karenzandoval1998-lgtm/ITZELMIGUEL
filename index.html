<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería Itzel y Miguel</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: transparent;
  font-family: Georgia, serif;
}

.galeria {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

.arco {
  position: relative;
  width: min(100%, 360px);
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border: 2px solid #b9a477;
  border-radius: 180px 180px 8px 8px;
  background: #62694b;
}

.foto {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transform: scale(1);
  transition: opacity 1.2s ease, transform 5s ease;
}

.foto.activa {
  opacity: 1;
  transform: scale(1.12);
}

@media (prefers-reduced-motion: reduce) {
  .foto { transition: none; }
}
</style>
</head>
<body>
<div class="galeria">
  <div class="arco">
    <!-- Sube las cuatro fotos junto a este archivo y conserva estos nombres. -->
    <img class="foto activa" src="./foto1.jpg" alt="Fotografía 1">
    <img class="foto" src="./foto2.jpg" alt="Fotografía 2">
    <img class="foto" src="./foto3.jpg" alt="Fotografía 3">
    <img class="foto" src="./foto4.jpg" alt="Fotografía 4">
  </div>
</div>

<script>
(() => {
  const fotos = Array.from(document.querySelectorAll('.foto'));
  if (!fotos.length) return;

  let actual = 0;
  window.setInterval(() => {
    fotos[actual].classList.remove('activa');
    actual = (actual + 1) % fotos.length;
    fotos[actual].classList.add('activa');
  }, 5000);
})();
</script>
</body>
</html>
