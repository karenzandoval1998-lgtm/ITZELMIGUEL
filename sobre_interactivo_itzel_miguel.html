<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itzel & Miguel | Bienvenidos a nuestra boda</title>
<style>
:root{--oliva:#62694b;--oro:#c7ad68;--crema:#f7f1e5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--oliva)}
body{font-family:Georgia,'Times New Roman',serif}
.escena{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--oliva);isolation:isolate}
.sobre{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;z-index:3;transition:transform 1.05s cubic-bezier(.65,0,.35,1),opacity .9s ease,filter .9s ease;transform-origin:50% 51%}
.bienvenida{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;color:var(--oliva);background:radial-gradient(ellipse at center,#fffdf6 0%,var(--crema) 72%);opacity:0;transform:scale(.82);transition:opacity .8s ease .25s,transform 1.1s cubic-bezier(.16,1,.3,1) .25s}
.bienvenida:before,.bienvenida:after{content:"";position:absolute;inset:18px;border:1px solid rgba(199,173,104,.7);pointer-events:none}
.bienvenida:after{inset:25px;border-color:rgba(98,105,75,.25)}
.detalle{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:#9c8244;opacity:0;transform:translateY(12px)}
.titulo{font-size:clamp(34px,8vw,62px);font-weight:400;line-height:1.16;max-width:700px;margin:22px 0 18px;opacity:0;transform:translateY(18px)}
.titulo em{font-weight:400;color:#a88c4c}
.raya{width:70px;height:1px;background:var(--oro);margin:0 auto 20px;transform:scaleX(0);transform-origin:center}
.nombres{font-size:clamp(17px,4vw,24px);letter-spacing:3px;opacity:0;transform:translateY(12px)}
.abrir{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(90px,25vw,180px);aspect-ratio:1;border:0;border-radius:50%;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.abrir:focus-visible{outline:2px solid #f2d994;outline-offset:4px}
.ayuda{position:absolute;z-index:4;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));text-align:center;color:#f5edda;font-size:11px;letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.55);pointer-events:none;transition:opacity .3s}
.particula{position:absolute;z-index:4;width:5px;height:5px;border-radius:50%;background:#e3ca82;box-shadow:0 0 12px 3px rgba(227,202,130,.6);pointer-events:none;opacity:0}
.escena.abierto .sobre{transform:scale(1.12) rotate(-1deg);opacity:0;filter:blur(5px)}
.escena.abierto .bienvenida{opacity:1;transform:scale(1)}
.escena.abierto .detalle,.escena.abierto .titulo,.escena.abierto .nombres{animation:aparece .9s ease forwards}
.escena.abierto .detalle{animation-delay:.55s}
.escena.abierto .titulo{animation-delay:.8s}
.escena.abierto .raya{animation:crece .8s ease .95s forwards}
.escena.abierto .nombres{animation-delay:1.1s}
.escena.abierto .ayuda{opacity:0}
.escena.abierto .particula{animation:brillo 1.8s ease-out forwards}
@keyframes aparece{to{opacity:1;transform:translateY(0)}}
@keyframes crece{to{transform:scaleX(1)}}
@keyframes brillo{0%{opacity:0;transform:translateY(20px) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="escena" id="escena" aria-label="Sobre de invitaciÃ³n de boda">
  <section class="bienvenida" aria-live="polite">
    <div class="detalle">Con mucha alegrÃ­a</div>
    <h1 class="titulo">Bienvenidos<br><em>a nuestra boda</em></h1>
    <div class="raya"></div>
    <div class="nombres">ITZEL &amp; MIGUEL</div>
  </section>
  <img class="sobre" src="a_minimalist_elegant_close_up_stationery_cover_d.png" alt="Sobre verde olivo con sello dorado">
  <button class="abrir" id="abrir" aria-label="Tocar el sello para abrir el sobre" title="Toca el sello para abrir"></button>
  <div class="ayuda">TOCA EL SELLO PARA ABRIR</div>
</main>
<script>
const escena=document.getElementById('escena');
const boton=document.getElementById('abrir');
let iniciando=false;
boton.addEventListener('click',function(){
  if(iniciando)return;
  iniciando=true;
  escena.classList.add('abierto');
  for(let i=0;i<18;i++){
    const p=document.createElement('span');
    p.className='particula';
    p.style.left=(15+Math.random()*70)+'%';
    p.style.top=(25+Math.random()*55)+'%';
    p.style.animationDelay=(Math.random()*.8)+'s';
    escena.appendChild(p);
  }
  window.setTimeout(function(){
    window.location.href='https://sites.google.com/view/itzelmiguel-2026/home';
  },4300);
});
</script>
</body>
</html>
