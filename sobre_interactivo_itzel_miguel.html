<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itzel & Miguel | Nuestra boda</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#62694b;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;font-family:Georgia,serif}
.escena{position:relative;width:min(100vw,66.6667vh);width:min(100vw,66.6667dvh);height:min(150vw,100vh);height:min(150vw,100dvh);max-width:100vw;max-height:100dvh;overflow:hidden;background:#62694b;perspective:1200px}
.sobre{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 51%;transition:transform 1.1s ease,opacity 1.1s ease,filter 1.1s ease;z-index:3}
.tarjeta{position:absolute;z-index:2;left:7%;width:86%;bottom:7%;height:72%;background:#f5f0e4;border:1px solid #c6b47e;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#62694b;text-align:center;padding:20px;transform:translateY(60%);transition:transform 1.2s ease .25s}
.iniciales{font-size:clamp(40px,9vw,72px);font-style:italic}
.texto{margin-top:12px;font-size:clamp(12px,3vw,17px);letter-spacing:4px}
.abrir{position:absolute;z-index:5;left:50%;top:51%;transform:translate(-50%,-50%);width:25%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.abrir:focus-visible{outline:2px solid #f2d994;outline-offset:4px}
.ayuda{position:absolute;z-index:4;left:0;right:0;bottom:3%;text-align:center;color:#f5edda;font-size:11px;letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
.escena.abierto .sobre{transform:perspective(1000px) rotateX(28deg) scale(1.14);opacity:0;filter:blur(2px)}
.escena.abierto .tarjeta{transform:translateY(0)}
.escena.abierto .ayuda{opacity:0}
@media(prefers-reduced-motion:reduce){.sobre,.tarjeta{transition-duration:.2s}}
</style>
</head>
<body>
<main class="escena" id="escena" aria-label="Sobre de invitación">
  <div class="tarjeta" aria-hidden="true">
    <div class="iniciales">J M</div>
    <div class="texto">NUESTRA BODA</div>
  </div>
  <!-- Sube la imagen a GitHub con el nombre sobre-jm.png -->
  <img class="sobre" src="sobre-jm.png" alt="Sobre verde olivo con sello dorado JM">
  <button class="abrir" id="abrir" aria-label="Abrir el sobre de invitación" title="Pulsa el sello para abrir"></button>
  <div class="ayuda">PULSA EL SELLO PARA ABRIR</div>
</main>
<script>
const escena=document.getElementById('escena');
const boton=document.getElementById('abrir');
let iniciando=false;
boton.addEventListener('click',function(){
  if(iniciando)return;
  iniciando=true;
  escena.classList.add('abierto');
  window.setTimeout(function(){
    window.location.href='https://sites.google.com/view/itzelmiguel-2026/home';
  },1600);
});
</script>
</body>
</html>
